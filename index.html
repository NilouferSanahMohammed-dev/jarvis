<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="grid-overlay"></div>

<div class="edge-readout edge-tl" id="readoutTime"></div>
<button class="edge-readout edge-tr history-toggle" id="historyToggle" title="View conversation history">history</button>
<div class="edge-readout edge-bl" id="readoutPower">power &middot; <span id="powerVal">98%</span></div>
<div class="edge-readout edge-br" id="readoutStatus">standing by</div>

<main class="core-stage">
  <div class="core-wrap">
    <svg class="core-rings" id="coreRings" viewBox="0 0 400 400">
      <circle class="ring ring-outer" cx="200" cy="200" r="180" />
      <circle class="ring ring-mid" cx="200" cy="200" r="150" />
      <circle class="ring ring-inner" cx="200" cy="200" r="120" />
      <g id="tickMarks"></g>
    </svg>
    <div class="core-glow" id="coreGlow"></div>
    <div class="core-center">
      <div class="core-name">jarvis</div>
      <div class="core-hint" id="coreHint">tap to talk</div>
    </div>
  </div>

  <p class="toast" id="toast"></p>
</main>

<form class="text-input-row" id="textForm">
  <input type="text" id="textInput" placeholder="or type a command&hellip;" autocomplete="off" />
  <button type="submit">send</button>
</form>

<button class="talk-btn" id="talkBtn">
  <span id="talkBtnLabel">hold to talk</span>
</button>

<div class="history-overlay" id="historyOverlay">
  <div class="history-panel">
    <div class="history-header">
      <h2>conversation history</h2>
      <div class="history-actions">
        <button class="ghost-btn" id="clearHistoryBtn">clear</button>
        <button class="close-btn" id="closeHistoryBtn" aria-label="Close">&times;</button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script src="commands.js"></script>
<script src="script.js"></script>
</body>
</html>
