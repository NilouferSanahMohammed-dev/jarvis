<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="grid-overlay"></div>

<div class="edge-readout edge-tl" id="readoutTime"></div>
<div class="edge-readout edge-tr" id="readoutDate"></div>
<div class="edge-readout edge-bl" id="readoutPower">power &middot; <span id="powerVal">98%</span></div>
<div class="edge-readout edge-br" id="readoutStatus">standing by</div>

<main class="core-stage">
  <button class="core-wrap" id="coreWrap" aria-label="Tap to talk to jarvis">
    <svg class="core-rings" id="coreRings" viewBox="0 0 400 400">
      <circle class="ring ring-outer" cx="200" cy="200" r="180" />
      <circle class="ring ring-mid" cx="200" cy="200" r="150" />
      <circle class="ring ring-inner" cx="200" cy="200" r="120" />
      <g id="tickMarks"></g>
    </svg>
    <div class="core-glow" id="coreGlow"></div>
    <div class="core-center">
      <div class="core-name">jarvis</div>
      <div class="core-hint" id="coreHint">tap to talk</div>
    </div>
  </button>
</main>

<section class="transcript" id="transcript"></section>

<form class="text-input-row" id="textForm">
  <input type="text" id="textInput" placeholder="or type a command&hellip;" autocomplete="off" />
  <button type="submit">send</button>
</form>

<script src="commands.js"></script>
<script src="script.js"></script>
</body>
</html>
